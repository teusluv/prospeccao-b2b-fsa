spring:
  application:
    name: prospeccao-b2b
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Em produção defina JWT_SECRET com pelo menos 32 caracteres.
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-0123456789abcdef}
    expiracao-minutos: ${JWT_EXPIRACAO_MINUTOS:480}
  cors:
    origens-permitidas: ${CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*,https://prospectradar-b2b.vercel.app}
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:admin@fsa.com.br}
    senha: ${ADMIN_SENHA:admin123}
  google-places:
    # Chave da Places API (New), usada em /api/prospeccao/google-maps.
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: https://places.googleapis.com
  osm:
    # API pública e gratuita do OpenStreetMap (Overpass). Pode trocar por outro servidor Overpass.
    overpass-url: ${OSM_OVERPASS_URL:https://overpass-api.de/api/interpreter}
