services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: prospeccao
      POSTGRES_USER: prospeccao
      POSTGRES_PASSWORD: prospeccao
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospeccao"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/prospeccao
      DB_USUARIO: prospeccao
      DB_SENHA: prospeccao
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-0123456789abcdef}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fsa.com.br}
      ADMIN_SENHA: ${ADMIN_SENHA:-admin123}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:*,http://127.0.0.1:*,https://prospectradar-b2b.vercel.app}
    ports:
      - "8080:8080"

volumes:
  dados-postgres:
